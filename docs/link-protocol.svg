<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="DejaVu Sans, Segoe UI, sans-serif">
  <rect width="920" height="640" fill="#0c0c0e"/>
  <rect x="1" y="1" width="918" height="638" fill="none" stroke="#27272a" stroke-width="2" rx="10"/>

  <!-- заголовок -->
  <text x="460" y="42" text-anchor="middle" font-size="19" font-weight="bold" fill="#f4f4f5">Честный раунд Chronicle Link — commit-reveal без доверия</text>
  <text x="460" y="64" text-anchor="middle" font-size="12" fill="#71717a">никаких серверов: хост — просто релей, интенты и дайсы не подделать</text>

  <!-- дорожки -->
  <g>
    <rect x="60" y="88" width="220" height="44" rx="22" fill="#18181b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="170" y="115" text-anchor="middle" font-size="15" fill="#c4b5fd" font-weight="bold">Игрок А (Elena)</text>

    <rect x="350" y="88" width="220" height="44" rx="22" fill="#18181b" stroke="#d4af37" stroke-width="2"/>
    <text x="460" y="115" text-anchor="middle" font-size="15" fill="#e4c464" font-weight="bold">Стол-хост (релей)</text>

    <rect x="640" y="88" width="220" height="44" rx="22" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
    <text x="750" y="115" text-anchor="middle" font-size="15" fill="#93c5fd" font-weight="bold">Игрок Б (Torin)</text>
  </g>
  <line x1="170" y1="132" x2="170" y2="580" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="460" y1="132" x2="460" y2="580" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="750" y1="132" x2="750" y2="580" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- фаза 1: коммиты -->
  <g font-size="13">
    <path d="M 180 190 H 448" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrV)"/>
    <text x="312" y="180" text-anchor="middle" fill="#c4b5fd">🔒 intent_commit = SHA-256(интент | сид)</text>

    <path d="M 450 240 H 738" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrV)"/>
    <text x="595" y="230" text-anchor="middle" fill="#c4b5fd">relay 🔒</text>

    <path d="M 740 290 H 472" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrY)"/>
    <text x="600" y="280" text-anchor="middle" fill="#93c5fd">🔒 intent_commit</text>

    <path d="M 450 340 H 182" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrY)"/>
    <text x="310" y="330" text-anchor="middle" fill="#93c5fd">relay 🔒</text>
  </g>

  <g>
    <rect x="290" y="360" width="340" height="30" rx="15" fill="#1c1a10" stroke="#d4af37" stroke-width="1.5"/>
    <text x="460" y="380" text-anchor="middle" font-size="12.5" fill="#e4c464">все коммиты зафиксированы — назад пути нет</text>
  </g>

  <!-- фаза 2: раскрытия -->
  <g font-size="13">
    <path d="M 180 428 H 448" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrV)"/>
    <text x="312" y="418" text-anchor="middle" fill="#c4b5fd">🔓 intent_reveal (интент + сид)</text>

    <path d="M 450 470 H 738" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrY)"/>
    <text x="595" y="460" text-anchor="middle" fill="#93c5fd">🔓 intent_reveal</text>
    <text x="595" y="492" text-anchor="middle" fill="#71717a" font-size="12">каждый проверяет: SHA-256(раскрытое) == коммит</text>
  </g>

  <!-- фаза 3: канон -->
  <g font-size="13">
    <path d="M 180 536 H 448" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="312" y="526" text-anchor="middle" fill="#86efac">📜 round_result + чексумма канона</text>

    <path d="M 740 556 H 472" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="606" y="546" text-anchor="middle" fill="#86efac">📜 round_result</text>
  </g>

  <!-- итог -->
  <rect x="170" y="588" width="580" height="34" rx="17" fill="#0f1a12" stroke="#22c55e" stroke-width="2"/>
  <text x="460" y="610" text-anchor="middle" font-size="13.5" fill="#86efac" font-weight="bold">чексуммы сошлись → одинаковый лог WEGO на всех столах. Перекинуть дайс нельзя.</text>

  <defs>
    <marker id="arrV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>
