name: Release (Tauri bundles)

# Сборки нативных приложений под все три ОС и прикрепление к GitHub-релизу.
# Триггеры: пуш тега v* — или ручной запуск с указанием существующего тега
# (например, доехать артефакты к уже опубликованному v1.5.0).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для сборки (например v1.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (AppImage/deb/rpm)
            os: ubuntu-22.04
            args: ''
          - label: macOS (universal dmg)
            os: macos-latest
            args: '--target universal-apple-darwin'
          - label: Windows (MSI/NSIS)
            os: windows-latest
            args: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev patchelf

      - run: npm install --no-audit --no-fund

      - name: Build and attach bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # npm везде: bun.lock удалён, но фиксируем явно, чтобы action не
          # угадывал пакетный менеджер
          tauriScript: 'npm run tauri --'
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Chronicle Engine ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'Скачайте сборку для своей платформы: dmg (macOS, universal — Intel и Apple Silicon), MSI/NSIS (Windows), AppImage/deb/rpm (Linux).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
